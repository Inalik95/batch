# Block to add to each values-<env>.yaml (DEV, INT, QUAL1, QUAL2, QUAL3, PREPROD, PROD).
# Every <...> is unknown today and must be confirmed per environment. Nothing here is a real value.

envName: <DEV|INT|QUAL1|QUAL2|QUAL3|PREPROD|PROD>

camaroDuplicate:
  timeZone: Europe/Paris
  activeDeadlineSeconds: <e.g. 3600>
  schedules:
    DAILY:
      enabled: true
      cron: "<daily schedule, after Camaro delivery time>"
      suspend: false            # suspend: true in envs without Camaro feed
    MONTHLY:
      enabled: true
      cron: "<monthly schedule>"
  filePatterns:                 # glob on the object name (last segment of the key)
    DAILY: "<daily file glob>"
    MONTHLY: "<monthly file glob>"

  # IBM Cloud Object Storage
  cos:
    # Use the "direct" (or private) endpoint of the bucket's location from inside IKS/ROKS.
    endpoint: https://s3.direct.<location>.cloud-object-storage.appdomain.cloud
    region: <location, e.g. eu-de>
    bucket: <bucket name per env>
    inputPrefix: <e.g. camaro/in/>
    archivePrefix: <e.g. camaro/archive/>     # must differ from inputPrefix
    reportPrefix: <e.g. camaro/report/>       # "" to keep reports out of COS
    # Existing Secret holding the HMAC keys of a COS service credential (role: Writer on the bucket).
    # Created by Vision's usual mechanism (Vault / ESO / SealedSecret), never committed in clear.
    hmacSecret:
      name: <secret name>
      accessKeyIdKey: access_key_id
      secretAccessKeyKey: secret_access_key

  scratchSizeLimit: 1Gi         # > largest monthly file + report
  mail:
    enabled: true               # false in DEV if no SMTP
    from: <sender>
    to: [<recipient>]
    cc: []
  envFrom:
    - secretRef:
        name: <existing Vision DB/SMTP secret>
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }
