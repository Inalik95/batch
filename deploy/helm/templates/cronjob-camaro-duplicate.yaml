{{- /*
  Camaro duplicate job: one CronJob per frequency, same image, same job.
  Template only: align names, labels, image, volumes and secret refs with
  Vision's existing chart before merging. All values come from values-<env>.yaml.
*/ -}}
{{- range $type, $cfg := .Values.camaroDuplicate.schedules }}
{{- if $cfg.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-camaro-duplicate-{{ lower $type }}
  labels:
    app.kubernetes.io/component: camaro-duplicate-batch
spec:
  schedule: {{ $cfg.cron | quote }}
  timeZone: {{ $.Values.camaroDuplicate.timeZone | quote }}
  concurrencyPolicy: Forbid          # never two runs on the same input directory
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: {{ $cfg.suspend | default false }}
  jobTemplate:
    spec:
      backoffLimit: 0                # no blind retry: a failed run is restarted deliberately (same params)
      activeDeadlineSeconds: {{ $.Values.camaroDuplicate.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: camaro-duplicate
              image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
              args:
                - --spring.profiles.active={{ $.Values.springProfiles }},camaro-duplicate
                - --camaro.fileType={{ $type }}
              env:
                - name: VISION_ENV
                  value: {{ $.Values.envName | quote }}
                - name: CAMARO_DUPLICATE_INPUT_DIR
                  value: {{ $.Values.camaroDuplicate.paths.input | quote }}
                - name: CAMARO_DUPLICATE_ARCHIVE_DIR
                  value: {{ $.Values.camaroDuplicate.paths.archive | quote }}
                - name: CAMARO_DUPLICATE_REPORT_DIR
                  value: {{ $.Values.camaroDuplicate.paths.report | quote }}
                - name: CAMARO_DUPLICATE_DAILY_PATTERN
                  value: {{ $.Values.camaroDuplicate.filePatterns.DAILY | quote }}
                - name: CAMARO_DUPLICATE_MONTHLY_PATTERN
                  value: {{ $.Values.camaroDuplicate.filePatterns.MONTHLY | quote }}
                - name: CAMARO_DUPLICATE_MAIL_ENABLED
                  value: {{ $.Values.camaroDuplicate.mail.enabled | quote }}
                - name: CAMARO_DUPLICATE_MAIL_FROM
                  value: {{ $.Values.camaroDuplicate.mail.from | quote }}
                - name: CAMARO_DUPLICATE_MAIL_TO
                  value: {{ join "," $.Values.camaroDuplicate.mail.to | quote }}
                - name: CAMARO_DUPLICATE_MAIL_CC
                  value: {{ join "," ($.Values.camaroDuplicate.mail.cc | default list) | quote }}
              # DB + SMTP credentials: reuse Vision's existing secret mechanism (Vault / SealedSecret / ESO).
              envFrom:
                {{- toYaml $.Values.camaroDuplicate.envFrom | nindent 16 }}
              resources:
                {{- toYaml $.Values.camaroDuplicate.resources | nindent 16 }}
              volumeMounts:
                - name: camaro-data
                  mountPath: {{ $.Values.camaroDuplicate.paths.mountPath }}
          volumes:
            - name: camaro-data
              persistentVolumeClaim:
                claimName: {{ $.Values.camaroDuplicate.pvcName }}
{{- end }}
{{- end }}
