spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:h2:mem:camaro;DB_CLOSE_DELAY=-1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/camaro-duplicate/V1__camaro_duplicate_result.sql
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

vision:
  batch:
    camaro-duplicate:
      runner:
        enabled: false
      chunk-size: 2
      formats:
        DAILY:
          file-pattern: "duplicates_daily_*.csv"
        MONTHLY:
          file-pattern: "duplicates_monthly_*.csv"
          delimiter: "|"
      mail:
        to: ops@example.invalid
        from: vision@example.invalid
